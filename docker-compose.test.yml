version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: autohub-test-db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: autohub_test
    ports:
      - "5433:5432"
    volumes:
      - autohub-test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d autohub_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  autohub-test-db:
